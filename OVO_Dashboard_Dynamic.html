<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OVO Energy AU · Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --bg-soft: #F2F1EC;
    --ink: #16161A;
    --ink-dim: #44444A;
    --ink-mute: #72727A;
    --accent: #1E5641;
    --accent-soft: #E8F0EC;
    --navy: #0E2A44;
    --good: #1E5641;
    --bad: #A8352C;
    --amber: #B8761F;
    --rule: rgba(22, 22, 26, 0.10);
    --rule-soft: rgba(22, 22, 26, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    font-weight: 400;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* CONTROL BAR */
  .control-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .control-bar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1rem 2.5rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    flex-wrap: wrap;
  }
  .control-brand {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }
  .control-spacer { flex: 1; }
  .control-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .control-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .date-input {
    font-family: "Inter Tight", sans-serif;
    font-size: 0.85rem;
    padding: 0.45rem 0.6rem;
    background: white;
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .date-input:hover { border-color: var(--ink-dim); }
  .date-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .date-sep { color: var(--ink-mute); font-size: 0.85rem; }
  .btn-primary {
    font-family: "Inter Tight", sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.55rem 1.1rem;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .preset-row { display: flex; gap: 0.4rem; align-items: center; }
  .preset-btn {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    padding: 0.35rem 0.6rem;
    background: transparent;
    color: var(--ink-mute);
    border: 1px solid var(--rule);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .preset-btn:hover {
    color: var(--ink);
    border-color: var(--ink-dim);
  }
  .preset-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* MAIN */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 3rem 2.5rem 6rem;
  }
  @media (max-width: 700px) {
    main { padding: 2rem 1.25rem 4rem; }
    .control-bar-inner { padding: 0.75rem 1.25rem; }
  }

  /* HEADER */
  header { margin-bottom: 3rem; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border-top: 1.5px solid var(--accent);
    padding-top: 0.5rem;
    margin-bottom: 1.5rem;
    display: inline-block;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.25rem, 4.5vw, 3.5rem);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 22ch;
    margin-bottom: 1rem;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .subtitle {
    font-size: 1.05rem;
    color: var(--ink-dim);
    max-width: 60ch;
    line-height: 1.5;
  }
  .meta-row {
    display: flex;
    gap: 2.5rem;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  .meta-row .key {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-mute);
    display: block;
    margin-bottom: 0.15rem;
  }
  .meta-row .value { color: var(--ink); font-weight: 500; }

  /* KPIs */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin: 3rem 0 4rem;
  }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    padding: 1.75rem 1.5rem 1.75rem 0;
    border-right: 1px solid var(--rule);
  }
  .kpi:last-child { border-right: 0; }
  @media (max-width: 700px) { .kpi:nth-child(2) { border-right: 0; } }
  .kpi-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 0.75rem;
  }
  .kpi-value {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    line-height: 1.0;
    color: var(--ink);
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .kpi-delta {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-mute);
  }
  .kpi-delta.good { color: var(--good); }
  .kpi-delta.bad { color: var(--bad); }
  .kpi-delta .arrow { font-family: "JetBrains Mono", monospace; margin-right: 0.25em; }

  /* SECTIONS */
  section { margin-bottom: 4rem; }
  .section-head { margin-bottom: 2rem; }
  .section-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 28ch;
  }
  h2 em { font-style: italic; color: var(--accent); }
  p {
    color: var(--ink-dim);
    font-size: 1rem;
    line-height: 1.7;
    max-width: 70ch;
    margin-bottom: 1rem;
  }
  p strong { color: var(--ink); font-weight: 600; }
  p.lead { font-size: 1.1rem; line-height: 1.6; color: var(--ink); max-width: 60ch; }

  /* TABLES */
  .table-wrap { overflow-x: auto; margin: 1.5rem 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  thead th {
    text-align: left;
    font-family: "JetBrains Mono", monospace;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 0.9rem 0.75rem;
    border-bottom: 1.5px solid var(--ink);
    white-space: nowrap;
  }
  thead th.r { text-align: right; }
  tbody td {
    padding: 0.85rem 0.75rem;
    border-bottom: 1px solid var(--rule-soft);
    color: var(--ink-dim);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--bg-soft); }
  tbody td.r { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  tbody td.bold { font-weight: 600; color: var(--ink); }
  tbody td .delta {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
    font-weight: 500;
    margin-left: 0.5rem;
    color: var(--ink-mute);
  }
  tbody td .delta.good { color: var(--good); }
  tbody td .delta.bad { color: var(--bad); }
  tbody tr.total { background: var(--accent-soft); }
  tbody tr.total td { color: var(--ink); font-weight: 600; border-bottom: 0; }
  td.cr-good { color: var(--good); font-weight: 600; }
  td.cr-bad { color: var(--bad); font-weight: 600; }

  /* EXPANDABLE ROWS */
  tr.expandable td.bold { cursor: pointer; user-select: none; }
  tr.expandable:hover { background: var(--bg-soft); }
  .chevron {
    display: inline-block;
    width: 12px;
    margin-right: 0.5rem;
    transition: transform 0.3s ease;
    color: var(--ink-mute);
    font-size: 0.7em;
    transform: translateY(-1px);
  }
  tr.expandable.open .chevron { transform: rotate(90deg) translateX(-1px); }
  tr.drilldown { display: none; background: var(--bg-soft); }
  tr.drilldown.open { display: table-row; }
  tr.drilldown > td { padding: 0; }
  .drilldown-inner {
    padding: 1.25rem 1.5rem 1.5rem;
    border-top: 1px solid var(--rule);
  }
  .drilldown-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 0.6rem;
    margin-top: 0.5rem;
  }
  .drilldown-title:first-child { margin-top: 0; }
  table.nested {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    background: white;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--rule-soft);
  }
  table.nested thead th {
    padding: 0.5rem 0.7rem;
    font-size: 9.5px;
    border-bottom: 1px solid var(--rule);
  }
  table.nested tbody td {
    padding: 0.5rem 0.7rem;
    font-size: 0.82rem;
    border-bottom: 1px solid var(--rule-soft);
  }
  table.nested tbody tr:last-child td { border-bottom: 0; }
  table.nested tbody tr:hover { background: var(--bg-soft); }
  .ad-name {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .ad-name-tag {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    padding: 0.15rem 0.4rem;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 2px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .ad-name-tag.hero {
    background: var(--accent);
    color: white;
  }

  /* CHARTS */
  .chart { margin: 2rem 0; }
  .chart-title { font-weight: 600; font-size: 1rem; color: var(--ink); margin-bottom: 0.25rem; }
  .chart-sub { font-size: 0.8rem; color: var(--ink-mute); margin-bottom: 1.25rem; }

  .split-bars { margin-top: 1.25rem; }
  .split-row {
    display: grid;
    grid-template-columns: 100px 1fr 100px;
    gap: 1rem;
    align-items: center;
    margin-bottom: 0.8rem;
  }
  .split-label { font-weight: 600; font-size: 0.9rem; color: var(--ink); }
  .split-bar { height: 36px; display: flex; border-radius: 3px; overflow: hidden; }
  .split-bar-segment {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 0.85rem;
    transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .split-total {
    font-size: 0.85rem;
    color: var(--ink-mute);
    font-family: "JetBrains Mono", monospace;
    text-align: right;
  }
  .legend { display: flex; gap: 1.5rem; margin-top: 0.75rem; margin-left: calc(100px + 1rem); }
  .legend-item {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.85rem; color: var(--ink-dim);
  }
  .legend-swatch { width: 14px; height: 10px; border-radius: 2px; }

  .wow-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    margin-top: 1.25rem;
  }
  @media (max-width: 700px) { .wow-grid { grid-template-columns: 1fr; gap: 2rem; } }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    height: 180px;
    gap: 0.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    position: relative;
  }
  .bar-shape {
    width: 70%;
    transition: height 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  .bar-value {
    position: absolute;
    top: -1.4rem;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--ink);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .bar-label {
    position: absolute;
    bottom: -1.5rem;
    font-size: 0.7rem;
    color: var(--ink-mute);
    white-space: nowrap;
    text-align: center;
    width: 100%;
    line-height: 1.1;
  }
  .bar-col.current .bar-shape { box-shadow: 0 0 0 1.5px var(--ink); }

  .h-bar-chart { margin-top: 1.25rem; }
  .h-bar-row {
    display: grid;
    grid-template-columns: 180px 1fr 200px;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 0.8rem;
    font-size: 0.85rem;
  }
  .h-bar-label { text-align: right; color: var(--ink); font-weight: 500; }
  .h-bar-track { height: 22px; background: transparent; border-left: 1px solid var(--rule); position: relative; }
  .h-bar-fill {
    height: 100%;
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .h-bar-stat {
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    font-family: "JetBrains Mono", monospace;
    font-size: 0.78rem;
  }
  .h-bar-stat strong { color: var(--ink); }

  /* FOOTER */
  footer {
    margin-top: 5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
    font-size: 0.8rem;
    color: var(--ink-mute);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }

  /* LOADING STATE */
  .loading-veil { opacity: 0.4; pointer-events: none; transition: opacity 0.2s; }
  .dashboard { transition: opacity 0.2s; }

  /* ANIMATIONS */
  .fade-swap { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- ====== CONTROL BAR ====== -->
<div class="control-bar">
  <div class="control-bar-inner">
    <div class="control-brand">OVO · Performance Dashboard</div>
    <div class="control-spacer"></div>
    <div class="preset-row" id="presets"></div>
    <div class="control-group">
      <span class="control-label">Period</span>
      <input type="date" class="date-input" id="curStart" />
      <span class="date-sep">→</span>
      <input type="date" class="date-input" id="curEnd" />
    </div>
    <div class="control-group">
      <span class="control-label">vs</span>
      <input type="date" class="date-input" id="cmpStart" />
      <span class="date-sep">→</span>
      <input type="date" class="date-input" id="cmpEnd" />
    </div>
    <button class="btn-primary" id="applyBtn" disabled>Apply</button>
  </div>
</div>

<main>
  <div id="dashboard" class="dashboard"></div>
</main>

<script>
/* ============================================================
   FORMAT HELPERS
============================================================ */
const fmtCurrency = v => '$' + Math.round(v).toLocaleString('en-AU');
const fmtCurrency2 = v => '$' + v.toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtInt = v => Math.round(v).toLocaleString('en-AU');
const fmtCompact = v => {
  if (v >= 1000000) return (v/1000000).toFixed(2) + 'M';
  if (v >= 1000) return Math.round(v/1000) + 'K';
  return String(Math.round(v));
};
const fmtPct = (v, dp=2) => v.toFixed(dp) + '%';
const fmtPctFromFraction = (v, dp=1) => (v*100).toFixed(dp) + '%';
const fmtDuration = s => {
  const m = Math.floor(s/60);
  const r = Math.round(s%60);
  return `${m}m ${String(r).padStart(2, '0')}s`;
};

/* ============================================================
   DATE HELPERS
============================================================ */
const isoDate = d => d.toISOString().slice(0, 10);
const parseISO = s => new Date(s + 'T00:00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000) + 1;

function startOfWeekMon(d) {
  const x = new Date(d);
  const day = x.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  x.setDate(x.getDate() + diff);
  return x;
}

function fmtDateRange(start, end) {
  const s = parseISO(start);
  const e = parseISO(end);
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
    return `${s.getDate()} to ${e.getDate()} ${monthNames[e.getMonth()]} ${e.getFullYear()}`;
  }
  return `${s.getDate()} ${monthShort[s.getMonth()]} to ${e.getDate()} ${monthShort[e.getMonth()]} ${e.getFullYear()}`;
}

/* ============================================================
   DETERMINISTIC SEEDED RNG (so same date range = same numbers)
============================================================ */
function seedFromString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function makeRng(seed) {
  let state = seed;
  return () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 0xffffffff;
  };
}

/* ============================================================
   MOCK DATA GENERATOR
============================================================ */
const BASELINE_PER_DAY = {
  meta: {
    spend: 1234, impressions: 89797, clicks: 1739,
    apps: 36, lpv: 174, reach_share: 0.30,
    ev_spend_share: 0.573, ev_imp_share: 0.612,
    ev_click_share: 0.84, ev_apps_share: 0.16, ev_lpv_share: 0.879,
  },
  ga4: {
    "google / organic":      { sess: 2535, conv: 60, eng: 0.473, dur: 198 },
    "(direct) / (none)":     { sess: 1768, conv: 61, eng: 0.478, dur: 171 },
    "meta / paid_social":    { sess: 689,  conv: 1,  eng: 0.206, dur: 36 },
    "RAF":                   { sess: 247,  conv: 43, eng: 0.616, dur: 349 },
    "bing / organic":        { sess: 139,  conv: 5,  eng: 0.540, dur: 298 },
    "OVO / Agent":           { sess: 53,   conv: 9,  eng: 0.602, dur: 1000 },
    "electrify-me (utm)":    { sess: 17,   conv: 7,  eng: 0.727, dur: 492 },
    "take-OVO-with-you":     { sess: 17,   conv: 3,  eng: 0.580, dur: 302 },
    "compare.canstar.com.au":{ sess: 4,    conv: 0.3,eng: 0.286, dur: 110 },
  },
};

// Real ad and adset structure from Meta API (4-10 May baseline, per day)
// Used to deterministically scale ad detail with date range.
const CAMPAIGN_BREAKDOWN = {
  "FY26 Q3-Q4 · EV Interest": {
    adsets: [
      {
        name: "National | Update | Q4",
        spend: 548.66, impressions: 45766, clicks: 1247, reach: 24710,
        appsShare: 0.78, // share of campaign apps this adset takes
        ads: [
          { name: "AI | Hand", isHero: true, spend: 548.66, impressions: 45766, clicks: 1247, appsShare: 1.0 }
        ]
      },
      {
        name: "National | LAL - Website Visitors",
        spend: 158.30, impressions: 9175, clicks: 213, reach: 3849,
        appsShare: 0.22,
        ads: [
          { name: "AI | Hand", isHero: false, spend: 158.30, impressions: 9175, clicks: 213, appsShare: 1.0 }
        ]
      }

function generatePeriodData(startISO, endISO) {
  const days = diffDays(startISO, endISO);
  const seed = seedFromString(`${startISO}::${endISO}`);
  const rand = makeRng(seed);
  const variance = (min=0.85, max=1.15) => min + rand() * (max - min);

  const b = BASELINE_PER_DAY.meta;
  const spend = b.spend * days * variance(0.9, 1.1);
  const impressions = Math.round(b.impressions * days * variance());
  const clicks = Math.round(b.clicks * days * variance() * variance(0.85, 1.15));
  const ctr = (clicks / impressions) * 100;
  const reach = Math.round(impressions * b.reach_share * variance(0.95, 1.05));
  const lpv = Math.round(b.lpv * days * variance());
  const ev_apps = Math.max(1, Math.round(b.apps * days * b.ev_apps_share * variance(0.8, 1.2)));
  const f3_apps = Math.max(1, Math.round(b.apps * days * (1 - b.ev_apps_share) * variance(0.8, 1.3)));
  const apps = ev_apps + f3_apps;
  const cpa = spend / apps;

  const ev_spend = spend * b.ev_spend_share;
  const f3_spend = spend - ev_spend;
  const ev_imp = Math.round(impressions * b.ev_imp_share);
  const f3_imp = impressions - ev_imp;
  const ev_clicks = Math.round(clicks * b.ev_click_share);
  const f3_clicks = clicks - ev_clicks;
  const ev_lpv = Math.round(lpv * b.ev_lpv_share);
  const f3_lpv = lpv - ev_lpv;

  const campaigns = [
    {
      name: "FY26 Q3-Q4 · EV Interest",
      spend: ev_spend, impressions: ev_imp, clicks: ev_clicks,
      ctr: (ev_clicks/ev_imp)*100, lpv: ev_lpv, apps: ev_apps,
      cpa: ev_spend / ev_apps,
      breakdown: buildBreakdown("FY26 Q3-Q4 · EV Interest", days, ev_apps, rand),
    },
    {
      name: "FY26 Q4 · Free 3 Plan · VIC + NCEF",
      spend: f3_spend, impressions: f3_imp, clicks: f3_clicks,
      ctr: (f3_clicks/f3_imp)*100, lpv: f3_lpv, apps: f3_apps,
      cpa: f3_spend / f3_apps,
      breakdown: buildBreakdown("FY26 Q4 · Free 3 Plan · VIC + NCEF", days, f3_apps, rand),
    },
  ];

  // 4-week trend ending at endISO
  const weeklyTrend = [];
  for (let i = 3; i >= 0; i--) {
    const bucketEnd = addDays(parseISO(endISO), -i * 7);
    const bucketStart = addDays(bucketEnd, -6);
    const bucketEndISO = isoDate(bucketEnd);
    const bucketStartISO = isoDate(bucketStart);
    const wSeed = seedFromString(`${bucketStartISO}::${bucketEndISO}::w`);
    const wRand = makeRng(wSeed);
    weeklyTrend.push({
      label: `${bucketStart.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][bucketStart.getMonth()]}-${bucketEnd.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][bucketEnd.getMonth()]}`,
      apps: 150 + Math.round(wRand() * 120),
      cpa: 25 + wRand() * 35,
      isCurrent: i === 0,
    });
  }

  const sources = Object.entries(BASELINE_PER_DAY.ga4).map(([name, base]) => {
    const sess = Math.round(base.sess * days * variance(0.9, 1.1));
    const conv = Math.round(base.conv * days * variance(0.85, 1.2));
    return {
      source: name,
      sessions: sess,
      users: Math.round(sess * (0.7 + rand() * 0.25)),
      engagementRate: base.eng * variance(0.95, 1.05),
      avgDurationSeconds: base.dur * variance(0.9, 1.1),
      conversions: conv,
      conversionRate: sess > 0 ? conv / sess : 0,
    };
  });
  const totalConversions = sources.reduce((a, s) => a + s.conversions, 0);

  return {
    meta: { spend, impressions, clicks, ctr, reach, frequency: impressions/reach,
            apps, lpv, cpa, campaigns, weeklyTrend },
    ga4: { totalConversions, sources },
    range: { start: startISO, end: endISO },
    days,
  };
}

function buildBreakdown(campaignName, days, campaignApps, rand) {
  const tmpl = CAMPAIGN_BREAKDOWN[campaignName];
  if (!tmpl) return { adsets: [] };
  const v = (min=0.9, max=1.1) => min + rand() * (max - min);

  const adsets = tmpl.adsets.map(as => {
    const spend = as.spend * days * v(0.92, 1.08);
    const impressions = Math.round(as.impressions * days * v());
    const clicks = Math.round(as.clicks * days * v(0.88, 1.12));
    const ctr = impressions > 0 ? (clicks / impressions) * 100 : 0;
    const reach = Math.round(as.reach * days * v(0.95, 1.05));
    const apps = Math.max(0, Math.round(campaignApps * as.appsShare * v(0.85, 1.15)));
    const cpa = apps > 0 ? spend / apps : null;
    const cpm = impressions > 0 ? (spend / impressions) * 1000 : 0;

    const ads = as.ads.map(ad => {
      const adSpend = ad.spend * days * v(0.92, 1.08);
      const adImp = Math.round(ad.impressions * days * v());
      const adClicks = Math.round(ad.clicks * days * v(0.88, 1.12));
      const adCtr = adImp > 0 ? (adClicks / adImp) * 100 : 0;
      const adApps = Math.round(apps * ad.appsShare * v(0.9, 1.1));
      const adCpa = adApps > 0 ? adSpend / adApps : null;
      return {
        name: ad.name,
        isHero: ad.isHero,
        spend: adSpend,
        impressions: adImp,
        clicks: adClicks,
        ctr: adCtr,
        apps: adApps,
        cpa: adCpa,
      };
    });

    return {
      name: as.name,
      spend, impressions, clicks, ctr, reach, apps, cpa, cpm,
      ads,
    };
  });

  return { adsets };
}

function computeDelta(now, prev) {
  if (prev === 0) return { pct: null, direction: 'flat' };
  const pct = ((now - prev) / prev) * 100;
  if (Math.abs(pct) < 0.5) return { pct, direction: 'flat' };
  return { pct, direction: pct > 0 ? 'up' : 'down' };
}

/* ============================================================
   PRESETS
============================================================ */
const PRESETS = [
  { value: 'last_7d',   label: 'Last 7 days' },
  { value: 'last_14d',  label: 'Last 14 days' },
  { value: 'last_30d',  label: 'Last 30 days' },
  { value: 'this_week', label: 'This week (Mon-Sun)' },
  { value: 'last_week', label: 'Last week' },
];

function applyPreset(preset, today = new Date()) {
  let curStart, curEnd, cmpStart, cmpEnd;
  switch (preset) {
    case 'last_7d': {
      curEnd = addDays(today, -1); curStart = addDays(curEnd, -6);
      cmpEnd = addDays(curStart, -1); cmpStart = addDays(cmpEnd, -6);
      break;
    }
    case 'last_14d': {
      curEnd = addDays(today, -1); curStart = addDays(curEnd, -13);
      cmpEnd = addDays(curStart, -1); cmpStart = addDays(cmpEnd, -13);
      break;
    }
    case 'last_30d': {
      curEnd = addDays(today, -1); curStart = addDays(curEnd, -29);
      cmpEnd = addDays(curStart, -1); cmpStart = addDays(cmpEnd, -29);
      break;
    }
    case 'this_week': {
      curStart = startOfWeekMon(today); curEnd = addDays(curStart, 6);
      cmpEnd = addDays(curStart, -1); cmpStart = addDays(cmpEnd, -6);
      break;
    }
    case 'last_week': {
      const thisStart = startOfWeekMon(today);
      curEnd = addDays(thisStart, -1); curStart = addDays(curEnd, -6);
      cmpEnd = addDays(curStart, -1); cmpStart = addDays(cmpEnd, -6);
      break;
    }
  }
  return {
    curStart: isoDate(curStart), curEnd: isoDate(curEnd),
    cmpStart: isoDate(cmpStart), cmpEnd: isoDate(cmpEnd),
  };
}

/* ============================================================
   HEADLINE LOGIC
============================================================ */
function pickHeadline(deltas) {
  const { apps, cpa, f3Apps, f3Cpa } = deltas;
  if (f3Apps.pct !== null && f3Apps.pct > 30 && f3Cpa.pct !== null && f3Cpa.pct < -15) {
    return {
      title: `Free 3 Plan <em>broke</em> through this period.`,
      subtitle: `Meta applications up ${Math.round(apps.pct)}% versus comparison, blended CPA down ${Math.abs(Math.round(cpa.pct))}%. Free 3 carried the lift.`,
      h2: `A strong period, driven by <em>Free 3 Plan</em>.`,
    };
  }
  if (apps.pct !== null && apps.pct > 10 && cpa.pct !== null && cpa.pct < -5) {
    return {
      title: `Meta efficiency <em>improved</em>.`,
      subtitle: `Applications up ${Math.round(apps.pct)}%, cost per application down ${Math.abs(Math.round(cpa.pct))}%.`,
      h2: `Spend is converting <em>harder</em> this period.`,
    };
  }
  if (apps.pct !== null && apps.pct < -10) {
    return {
      title: `Volume <em>dropped</em> this period.`,
      subtitle: `Applications down ${Math.abs(Math.round(apps.pct))}% versus comparison. Worth diagnosing whether it is creative fatigue, audience saturation, or seasonality.`,
      h2: `Why <em>application volume</em> fell.`,
    };
  }
  return {
    title: `A <em>steady</em> period.`,
    subtitle: `Applications and spend held within normal weekly variance. Detail by campaign and channel below.`,
    h2: `Performance <em>summary</em>.`,
  };
}

============================================================ */
function renderDeltaHTML(pct, invert = false) {
  if (pct === null || pct === undefined) return `<span class="delta">—</span>`;
  const isFlat = Math.abs(pct) < 0.5;
  const isGood = invert ? pct < 0 : pct > 0;
  const cls = isFlat ? '' : isGood ? 'good' : 'bad';
  const sign = pct > 0 ? '+' : '';
  return `<span class="delta ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function renderKpi(label, value, delta, invert = false) {
  if (delta.pct === null) {
    return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-delta">—</div></div>`;
  }
  const isFlat = Math.abs(delta.pct) < 0.5;
  const isGood = invert ? delta.pct < 0 : delta.pct > 0;
  const cls = isFlat ? '' : isGood ? 'good' : 'bad';
  const arrow = isFlat ? '·' : delta.pct > 0 ? '↑' : '↓';
  return `<div class="kpi">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-delta ${cls}"><span class="arrow">${arrow}</span>${Math.abs(delta.pct).toFixed(1)}% vs comparison</div>
  </div>`;
}

function renderBreakdown(now, prev) {
  if (!now.breakdown || !now.breakdown.adsets || now.breakdown.adsets.length === 0) {
    return '<p style="margin: 0; color: var(--ink-mute);">No adset breakdown available.</p>';
  }

  // Build a map of previous adsets by name for WoW deltas
  const prevAdsetMap = new Map((prev.breakdown?.adsets || []).map(a => [a.name, a]));

  // ADSET TABLE
  const adsetRows = now.breakdown.adsets.map(as => {
    const p = prevAdsetMap.get(as.name);
    const spendD = p ? computeDelta(as.spend, p.spend) : {pct: null};
    const ctrD = p ? computeDelta(as.ctr, p.ctr) : {pct: null};
    const appsD = p ? computeDelta(as.apps, p.apps) : {pct: null};
    const cpaD = (p && as.cpa !== null && p.cpa !== null) ? computeDelta(as.cpa, p.cpa) : {pct: null};
    return `
      <tr>
        <td class="bold">${as.name}</td>
        <td class="r">${fmtCurrency(as.spend)} ${renderDeltaHTML(spendD.pct)}</td>
        <td class="r">${fmtCompact(as.impressions)}</td>
        <td class="r">${fmtInt(as.clicks)}</td>
        <td class="r">${fmtPct(as.ctr)} ${renderDeltaHTML(ctrD.pct)}</td>
        <td class="r">${fmtCompact(as.reach)}</td>
        <td class="r">${fmtInt(as.apps)} ${renderDeltaHTML(appsD.pct)}</td>
        <td class="r">${as.cpa !== null ? fmtCurrency2(as.cpa) : '—'} ${renderDeltaHTML(cpaD.pct, true)}</td>
      </tr>
    `;
  }).join('');

  // AD TABLE — flatten all ads across adsets, sorted by spend
  const allAds = [];
  now.breakdown.adsets.forEach(as => {
    as.ads.forEach(ad => {
      allAds.push({...ad, adset: as.name});
    });
  });
  allAds.sort((a, b) => b.spend - a.spend);

  const adRows = allAds.map(ad => `
    <tr>
      <td>
        <div class="ad-name">
          <span class="ad-name-tag ${ad.isHero ? 'hero' : ''}">${ad.isHero ? 'TOP' : 'AD'}</span>
          <span class="bold">${ad.name}</span>
        </div>
      </td>
      <td style="color: var(--ink-mute); font-size: 0.78rem;">${ad.adset}</td>
      <td class="r">${fmtCurrency(ad.spend)}</td>
      <td class="r">${fmtCompact(ad.impressions)}</td>
      <td class="r">${fmtInt(ad.clicks)}</td>
      <td class="r">${fmtPct(ad.ctr)}</td>
      <td class="r">${fmtInt(ad.apps)}</td>
      <td class="r">${ad.cpa !== null ? fmtCurrency2(ad.cpa) : '—'}</td>
    </tr>
  `).join('');

  return `
    <div class="drilldown-title">Ad sets (${now.breakdown.adsets.length})</div>
    <table class="nested">
      <thead>
        <tr>
          <th>Ad set</th>
          <th class="r">Spend</th>
          <th class="r">Imps</th>
          <th class="r">Clicks</th>
          <th class="r">CTR</th>
          <th class="r">Reach</th>
          <th class="r">Apps</th>
          <th class="r">CPA</th>
        </tr>
      </thead>
      <tbody>${adsetRows}</tbody>
    </table>

    <div class="drilldown-title">Ads (${allAds.length})</div>
    <table class="nested">
      <thead>
        <tr>
          <th>Ad</th>
          <th>Ad set</th>
          <th class="r">Spend</th>
          <th class="r">Imps</th>
          <th class="r">Clicks</th>
          <th class="r">CTR</th>
          <th class="r">Apps</th>
          <th class="r">CPA</th>
        </tr>
      </thead>
      <tbody>${adRows}</tbody>

          Meta delivered <strong>${fmtInt(cur.meta.apps)} applications</strong> on ${fmtCurrency(cur.meta.spend)} of spend, ${appsDelta.direction === 'up' ? 'up' : appsDelta.direction === 'down' ? 'down' : 'flat'} from ${fmtInt(cmp.meta.apps)} applications last period on similar budget. Blended CPA landed at <strong>${fmtCurrency2(cur.meta.cpa)}</strong>, a change of ${cpaDelta.pct !== null ? (cpaDelta.pct > 0 ? '+' : '') + cpaDelta.pct.toFixed(1) + '%' : '—'} versus comparison.

        <p>
          GA4 saw <strong>${fmtInt(cur.ga4.totalConversions)} total conversions</strong> (${convDelta.pct !== null ? (convDelta.pct > 0 ? '+' : '') + convDelta.pct.toFixed(1) + '%' : '—'} WoW). RAF continues to be the most efficient channel at ${fmtPctFromFraction(rafCR, 1)} conversion rate.

      </section>

                <th class="r">CTR</th>
                <th class="r">LPV</th>

                <td class="r">${fmtInt(cur.meta.lpv)}</td>
                <td class="r">${fmtInt(cur.meta.apps)}</td>

      <footer>

    </div>
  `;

  return html;
}

/* ============================================================
   APP STATE + EVENT WIRING
============================================================ */
let state = {
  curStart: null, curEnd: null, cmpStart: null, cmpEnd: null,
  activePreset: null, loading: false,
};
let draft = { curStart: null, curEnd: null, cmpStart: null, cmpEnd: null };

function updateApplyButton() {
  const btn = document.getElementById('applyBtn');
  const dirty = draft.curStart !== state.curStart || draft.curEnd !== state.curEnd
             || draft.cmpStart !== state.cmpStart || draft.cmpEnd !== state.cmpEnd;
  btn.disabled = state.loading || !dirty;
  btn.textContent = state.loading ? 'Loading…' : 'Apply';
}

function renderPresets() {
  const root = document.getElementById('presets');
  root.innerHTML = PRESETS.map(p =>
    `<button class="preset-btn ${state.activePreset === p.value ? 'active' : ''}" data-preset="${p.value}">${p.label}</button>`
  ).join('');
  root.querySelectorAll('.preset-btn').forEach(b => {
    b.addEventListener('click', () => {
      const preset = b.dataset.preset;
      const r = applyPreset(preset);
      draft = r;
      state.activePreset = preset;
      syncInputsFromDraft();
      runUpdate();
    });
  });
}

function syncInputsFromDraft() {
  document.getElementById('curStart').value = draft.curStart;
  document.getElementById('curEnd').value = draft.curEnd;
  document.getElementById('cmpStart').value = draft.cmpStart;
  document.getElementById('cmpEnd').value = draft.cmpEnd;
}

function wireInputs() {
  ['curStart','curEnd','cmpStart','cmpEnd'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      draft[id] = e.target.value;
      state.activePreset = null;
      renderPresets();
      updateApplyButton();
    });
  });
  document.getElementById('applyBtn').addEventListener('click', () => {
    runUpdate();
  });
}

function wireExpandableRows() {
  document.querySelectorAll('tr.expandable').forEach(row => {
    row.addEventListener('click', () => {
      const targetId = row.dataset.target;
      const target = document.getElementById(targetId);
      if (!target) return;
      row.classList.toggle('open');
      target.classList.toggle('open');
    });
  });
}

function runUpdate() {
  // Validate: end >= start for both periods
  if (draft.curStart > draft.curEnd) {
    alert('Period start must be on or before end.');
    return;
  }
  if (draft.cmpStart > draft.cmpEnd) {
    alert('Comparison start must be on or before end.');
    return;
  }
  state.loading = true;
  state.curStart = draft.curStart; state.curEnd = draft.curEnd;
  state.cmpStart = draft.cmpStart; state.cmpEnd = draft.cmpEnd;
  updateApplyButton();
  document.getElementById('dashboard').classList.add('loading-veil');

  // Simulated latency so the UI feels real
  setTimeout(() => {
    const payload = {
      current: generatePeriodData(state.curStart, state.curEnd),
      comparison: generatePeriodData(state.cmpStart, state.cmpEnd),
    };
    document.getElementById('dashboard').innerHTML = renderDashboard(
      payload,
      { start: state.curStart, end: state.curEnd },
      { start: state.cmpStart, end: state.cmpEnd }
    );
    wireExpandableRows();
    state.loading = false;
    document.getElementById('dashboard').classList.remove('loading-veil');
    updateApplyButton();
    renderPresets();
  }, 350);
}

/* ============================================================
   INIT
============================================================ */
(function init() {
  // Default to Last 7 days
  const r = applyPreset('last_7d');
  draft = r;
  state.activePreset = 'last_7d';
  syncInputsFromDraft();
  renderPresets();
  wireInputs();
  runUpdate();
})();
</script>
